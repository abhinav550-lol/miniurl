services:
  postgres:
    image: postgres:17-alpine
    container_name: miniurl-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniurl -d miniurl_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  memcached:
    image: memcached:1.6-alpine
    container_name: miniurl-memcached
    restart: unless-stopped

    ports:
      - "11211:11211"

    command: memcached -m 64

  um_service:
    build:
      context: ./services/um_service
      dockerfile: Dockerfile
    env_file:
      - ./.env
      - ./services/um_service/.env.prod
    ports:
    - "6001:6001"  
  url_generation_service:
    build:
      context: ./services/url_generation_service
      dockerfile: Dockerfile
    env_file:
      - ./.env
      - ./services/url_generation_service/.env.prod
    ports:
    - "6002:6002"

volumes:
  postgres-data: